dirs:
  - ./docs
excludedDirs:
  - ./build
  - ./.vercel
  - ./.docusaurus
  - ./node_modules
  - ./versioned_docs
useGitIgnore: true

ignorePatterns:
- pattern: '^http(s)?://localhost'
- pattern: '^http(s)?://127.0.0.1'
- pattern: '^http(s)?://gitlab.com/Consensys-Incorporated/'
- pattern: '^http(s)?://consensys.net'
- pattern: '^http(s)?://.+.zendesk.com'
- pattern: '^http(s)?://.+.etherscan.io'
- pattern: '^http(s)?://help.figma.com'
- pattern: '^http(s)?://metamask.io'
- pattern: '^http(s)?://.*\.hashicorp\.com'
- pattern: '^/img/'
# Operation pages under reference/api/eth1 and eth2 are generated at build time and gitignored.
- pattern: 'api/eth[12](/|$)'
aliveStatusCodes:
- 200
- 206
- 400
- 403