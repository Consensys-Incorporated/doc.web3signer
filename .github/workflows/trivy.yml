---
name: Trivy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {} # lock everything by default (least-privilege)

jobs:
  trivy:
    permissions:
      actions: read
      contents: read
      security-events: write
    # TODO: repin to the 2.0.0 release once Consensys-Incorporated/github-actions#6 merges
    uses: Consensys-Incorporated/github-actions/.github/workflows/trivy.yml@b48e2c11e7fad3c019573e66f9fdf313834e07b0 # feat/trivy-reusable-workflow
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
