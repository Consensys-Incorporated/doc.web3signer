---
name: Trivy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {} # lock everything by default (least-privilege)

jobs:
  trivy:
    permissions:
      actions: read
      contents: read
      security-events: write
    # TODO: repin to the 2.0.0 release once Consensys-Incorporated/github-actions#6 merges
    uses: Consensys-Incorporated/github-actions/.github/workflows/trivy.yml@c7958dad9706ba1fab7d6f08a2471ce9a0531a45 # feat/trivy-reusable-workflow
