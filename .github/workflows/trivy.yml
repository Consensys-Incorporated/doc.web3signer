---
name: Trivy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {} # lock everything by default (least-privilege)

jobs:
  trivy:
    permissions:
      actions: read
      contents: read
      security-events: write
    # TODO: repin to the 2.0.0 release once Consensys-Incorporated/github-actions#6 merges
    uses: Consensys-Incorporated/github-actions/.github/workflows/trivy.yml@cb261db88cd616d0b9e4e74cf7d83a6709a003f1 # feat/trivy-reusable-workflow
    with:
      environment: security # holds SLACK_WEBHOOK
