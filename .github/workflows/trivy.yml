---
name: Trivy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {} # lock everything by default (least-privilege)

jobs:
  trivy:
    permissions:
      actions: read
      contents: read
      security-events: write
    # TODO: repin to the 2.0.0 release once Consensys-Incorporated/github-actions#6 merges
    uses: Consensys-Incorporated/github-actions/.github/workflows/trivy.yml@e1b30b37e394d845e53a438c63c3a9234d6db59f # feat/trivy-reusable-workflow
    with:
      environment: security # holds SLACK_WEBHOOK
